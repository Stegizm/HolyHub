# ============================================================
# HolyHub — GitHub Actions Release Workflow
# ============================================================
# Triggers on:
#   - Push of version tag (v1.0.0, v1.1.0-beta, etc.)
#   - Manual dispatch from Actions tab
#
# Produces:
#   - holyhub-windows.zip     (Windows portable)
#   - holyhub-linux.tar.gz    (Linux portable)
#   - holyhub-docker-image    (Docker image, pushed to GHCR)
#
# Uploads all to GitHub Releases automatically.
# ============================================================

name: 🚀 Release

on:
  push:
    tags:
      - 'v*'           # v1.0.0, v2.1.3, etc.
      - 'v*-beta*'     # v1.0.0-beta1
      - 'v*-rc*'       # v1.0.0-rc1
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write   # to create releases
  packages: write   # to push Docker image to GHCR

jobs:
  # ───────────────────────────────────────────────────────────
  # Job 1: Build portable builds (Windows + Linux)
  # ───────────────────────────────────────────────────────────
  build-portable:
    name: 📦 Build Portable (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            archive: zip
            artifact: holyhub-windows.zip
          - os: linux
            archive: tar.gz
            artifact: holyhub-linux.tar.gz

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build standalone
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📁 Assemble portable folder
        run: |
          mkdir -p holyhub/.next
          cp -r .next/standalone/* holyhub/
          cp -r .next/static holyhub/.next/
          cp -r public holyhub/
          cp .env.example holyhub/.env.local
          cp README.md holyhub/
          cp LICENSE holyhub/

      - name: 🪟 Add Windows launcher
        if: matrix.os == 'windows'
        run: |
          cat > holyhub/run.bat << 'EOF'
          @echo off
          cd /d "%~dp0"
          echo HolyHub starting...
          echo Edit .env.local to add your GEMINI_API_KEY
          echo Open: http://localhost:3000
          node server.js
          pause
          EOF

      - name: 🐧 Add Linux launcher
        if: matrix.os == 'linux'
        run: |
          cat > holyhub/run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "HolyHub starting..."
          echo "Edit .env.local to add your GEMINI_API_KEY"
          echo "Open: http://localhost:3000"
          node server.js
          EOF
          chmod +x holyhub/run.sh

      - name: 📦 Archive (Windows zip)
        if: matrix.os == 'windows'
        run: zip -r ${{ matrix.artifact }} holyhub

      - name: 📦 Archive (Linux tar.gz)
        if: matrix.os == 'linux'
        run: tar -czf ${{ matrix.artifact }} holyhub

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # ───────────────────────────────────────────────────────────
  # Job 2: Build Docker image and push to GHCR
  # ───────────────────────────────────────────────────────────
  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ───────────────────────────────────────────────────────────
  # Job 3: Create GitHub Release with all artifacts
  # ───────────────────────────────────────────────────────────
  release:
    name: 🚀 Create Release
    needs: [build-portable, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📝 Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          cat > RELEASE_NOTES.md << EOF
          # HolyHub $VERSION

          ## 📦 Downloads

          ### Windows
          - **holyhub-windows.zip** — Portable, requires [Node.js 18+](https://nodejs.org/)
            1. Download and unzip
            2. Edit \`.env.local\` — add your \`GEMINI_API_KEY\`
            3. Double-click \`run.bat\`
            4. Open http://localhost:3000

          ### Linux
          - **holyhub-linux.tar.gz** — Portable, requires Node.js 18+
            \`\`\`bash
            tar -xzf holyhub-linux.tar.gz
            cd holyhub
            nano .env.local  # add your GEMINI_API_KEY
            ./run.sh
            \`\`\`

          ### Docker
          \`\`\`bash
          docker pull ghcr.io/stegizm/holyhub:latest
          docker run -p 3000:3000 -e GEMINI_API_KEY=your_key ghcr.io/stegizm/holyhub:latest
          \`\`\`

          ## 🔑 Getting a Gemini API Key
          1. Visit https://aistudio.google.com/app/apikey
          2. Click "Create API Key"
          3. Paste into \`.env.local\` file

          ## ⚙️ Requirements
          - Node.js 18+ (for portable builds)
          - OR Docker (for containerized version)
          - Google Gemini API key (free)

          ---
          Full changelog: https://github.com/stegizm/HolyHub/blob/main/CHANGELOG.md
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.VERSION }}
          name: HolyHub ${{ steps.notes.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/holyhub-windows.zip/holyhub-windows.zip
            artifacts/holyhub-linux.tar.gz/holyhub-linux.tar.gz
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.VERSION, 'beta') || contains(steps.notes.outputs.VERSION, 'rc') }}
          generate_release_notes: true
